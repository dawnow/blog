[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  HUGO_VERSION = "0.166.0"
  # HUGO_ENV / HUGO_ENABLEGITINFO 是旧变量名：前者改为 HUGO_ENVIRONMENT，
  # 后者在 0.166 已不再生效（不要指望它提供 git 日期）。
  HUGO_ENVIRONMENT = "production"
  # 构建时按页面用字重切字体子集，需要 Python + fonttools（见 requirements.txt）
  PYTHON_VERSION = "3.11"

# 字体文件名带内容哈希，可以长期强缓存
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker 本体必须每次回源校验，否则新版本会被缓存挡住
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# workbox 运行时文件名固定，升级时要能及时换成新内容
[[headers]]
  for = "/sw/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
